@let styles = { width: `${size()}px`, height: `${size()}px`, fontSize: `${size()}px`, '--mat-icon-button-icon-size': `${size()}px` }; 

@if (config(); as config) {
  @if (config.type === 'svg') {
    <mat-icon [svgIcon]="icon()" [style]="styles"></mat-icon>
  } @else if (config.type === 'gif') {
    <img [style]="{...styles, 'border-radius': `${size() / 6 }px`, overflow: 'hidden'}" [src]="config.url" alt="">
  }
} @else {
  <mat-icon [style]="styles">{{ icon() }}</mat-icon>
}
