@if (quantity(); as quantity) {
  <div class="f24-quantity" [matTooltip]="tooltip()">
    @if (label(); as label) {
      <p class="f24-quantity-label">
        {{ label }}
      </p>
    }
    <div class="f24-quantity-content">
      @if (icon(); as icon) {
        <f24-icon [icon]="icon" />
      }
      <span [class]="class()">
        {{ quantity | f24tonumber }}
      </span>
    </div>
  </div>
}
