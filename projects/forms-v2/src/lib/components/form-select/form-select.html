@if (resolvedForm(); as form) {
  <div class="f24-form-select-container">
    <mat-form-field
      [appearance]="resolvedAppearance()"
      class="f24-form-select"
      [class.f24-form-select-valid]="form().valid()"
    >

      <mat-label>{{ resolvedLabel() }}</mat-label>

      <mtx-select
        [formField]="form"
        [placeholder]="resolvedPlaceholder()"
        [items]="resolvedItems()"
        [bindLabel]="resolvedBindLabel()"
        [bindValue]="resolvedBindValue()"
        [multiple]="resolvedMultiple()"
      >
        <ng-template ng-label-tmp let-item="item" let-clear="clear" class="m2">
          {{ resolvedFormatterLabel()(item) }}
          @if (resolvedMultiple()) {
            <span class="ng-value-icon right" (click)="clear(item)">×</span>
          }
        </ng-template>
        <ng-template ng-option-tmp let-item="item">
          {{ resolvedFormatterOption()(item) }} 
        </ng-template>
      </mtx-select>

      <!-- Mostrar errores -->
      <mat-error>
        <f24-form-errors [field]="form()"/>
      </mat-error>
      <!-- Contenido adicional -->
      @if (templateSuffix(); as template) {
        <div class="f24-form-select-suffix" matSuffix>
          <ng-container *ngTemplateOutlet="template"></ng-container>
        </div>
      }
      <!-- Icono principal -->
      @if (resolvedIcon(); as icon) {
        <f24-icon class="f24-form-prefix-icon" matPrefix [icon]="icon"/>
      }
    </mat-form-field>
  </div>
}
